services:
  mysql:
    image: mysql:8
    container_name: noteapp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: noteapp
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - noteapp_network

  backend:
    build:
      context: ./backend
    container_name: noteapp_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DB_HOST: mysql
      DB_USER: root
      DB_PASS: root
      DB_PASSWORD: root
      DB_NAME: noteapp
      DB_PORT: 3306
      JWT_SECRET: super_secret_key_123
      CLIENT_URL: http://localhost:8080
      EMAIL_USER: xuankhanh07082006@gmail.com
      EMAIL_PASS: hxqi fyip vajv dixo
    networks:
      - noteapp_network

  frontend:
    build:
      context: ./frontend
    container_name: noteapp_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - noteapp_network

volumes:
  mysql_data:

networks:
  noteapp_network: